<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GrowUP Sales CRM</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",Meiryo,sans-serif;background:#f5f7fb;color:#172033}.wrap{max-width:1120px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px}.brand{font-weight:950;font-size:24px}.brand b{color:#2563eb}.sub{font-size:12px;color:#64748b}.btn{border:0;border-radius:11px;padding:11px 14px;font-weight:850;cursor:pointer;background:#172033;color:#fff}.btn.blue{background:#2563eb}.btn.green{background:#16a34a}.btn.light{background:#fff;color:#334155;border:1px solid #e2e8f0}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin-bottom:12px}.stat{background:#fff;border:1px solid #e6ebf2;border-radius:16px;padding:14px}.stat small{color:#64748b;font-weight:750}.stat strong{display:block;font-size:28px}.tools{display:flex;gap:8px;flex-wrap:wrap;background:#fff;border:1px solid #e6ebf2;border-radius:16px;padding:12px;margin-bottom:12px}.tools input,.tools select{border:1px solid #cbd5e1;border-radius:10px;padding:11px 12px;font:inherit;min-width:150px}.tools input{flex:1}.lead{background:#fff;border:1px solid #e6ebf2;border-radius:17px;padding:14px;margin-bottom:8px;display:grid;grid-template-columns:74px 1fr auto;gap:13px;align-items:center;cursor:pointer}.lead:hover{border-color:#93c5fd;box-shadow:0 7px 24px rgba(15,23,42,.06)}.score{width:62px;height:62px;border-radius:15px;background:#eff6ff;color:#1d4ed8;display:grid;place-items:center;font-size:23px;font-weight:950}.hot .score{background:#fff1f2;color:#e11d48}.name{font-size:17px;font-weight:950}.meta{font-size:12px;color:#64748b;margin-top:3px}.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}.tag{font-size:10px;font-weight:850;padding:4px 8px;border-radius:999px;background:#f1f5f9;color:#475569}.hotbadge{background:#ffe4e6;color:#be123c}.status{font-size:11px;font-weight:900;padding:6px 10px;border-radius:999px;background:#f1f5f9;white-space:nowrap}.empty{text-align:center;padding:65px 20px;color:#64748b;background:#fff;border-radius:16px}.login{position:fixed;inset:0;background:linear-gradient(145deg,#0f172a,#17375f 60%,#0d341b);display:grid;place-items:center;z-index:50;padding:20px}.loginbox{width:min(420px,100%);background:#fff;border-radius:24px;padding:28px}.loginbox h1{margin:0 0 7px}.loginbox p{color:#64748b;font-size:13px}.loginbox input{width:100%;padding:14px;border:1.5px solid #cbd5e1;border-radius:12px;font-size:17px;margin:10px 0}.err{color:#dc2626;font-size:12px;min-height:18px}.drawer{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;justify-content:flex-end;z-index:40}.panel{width:min(600px,100%);height:100%;overflow:auto;background:#f8fafc;padding:18px}.panelhead{display:flex;justify-content:space-between;gap:12px}.panel h2{margin:0}.box{background:#fff;border:1px solid #e2e8f0;border-radius:15px;padding:15px;margin-top:10px}.box h3{font-size:13px;margin:0 0 10px;color:#475569}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.field{font-size:12px;color:#64748b}.field b{display:block;color:#172033;font-size:14px;margin-top:3px;word-break:break-all}.sales{white-space:pre-wrap;font-size:13px;line-height:1.8;background:#f8fafc;border-radius:11px;padding:12px}.panel textarea,.panel select,.panel input{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:10px;font:inherit}.row{display:flex;gap:8px;margin-top:9px}.row>*{flex:1}.next{font-weight:900;color:#2563eb}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:10px 16px;background:#172033;color:#fff;border-radius:999px;font-size:12px;display:none;z-index:80}@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}.stat:last-child{grid-column:span 2}.lead{grid-template-columns:58px 1fr}.score{width:52px;height:52px}.lead>.status{grid-column:2}.grid2{grid-template-columns:1fr}.wrap{padding:12px}.top{align-items:flex-start}}</style></head><body><div class="login" id="login"><div class="loginbox"><h1>GrowUP Sales CRM</h1><p>管理アクセスコードを入力してください。</p><input id="code" type="password" placeholder="GUP-XXXX-XXXX"><button class="btn blue" style="width:100%" id="loginBtn">管理画面を開く</button><div class="err" id="loginErr"></div></div></div><div class="wrap"><div class="top"><div><div class="brand"><b>GrowUP</b> Sales CRM</div><div class="sub">HOT客を上から追う営業司令塔</div></div><div><button class="btn light" id="refresh">更新</button> <button class="btn light" id="logout">ログアウト</button></div></div><div class="stats"><div class="stat"><small>表示中</small><strong id="sTotal">0</strong></div><div class="stat"><small>🔥 HOT</small><strong id="sHot">0</strong></div><div class="stat"><small>未対応</small><strong id="sNew">0</strong></div><div class="stat"><small>商談</small><strong id="sMeeting">0</strong></div><div class="stat"><small>契約</small><strong id="sWon">0</strong></div></div><div class="tools"><input id="q" placeholder="店舗名・エリアを検索"><select id="filter"><option value="all">すべて</option><option value="new">未対応</option><option value="contacted">連絡済</option><option value="replied">返信あり</option><option value="meeting">商談</option><option value="won">契約</option><option value="lost">失注</option></select><button class="btn blue" id="search">検索</button></div><div id="list"></div></div><div class="drawer" id="drawer"><div class="panel"><div class="panelhead"><div><div class="sub" id="detailHot"></div><h2 id="detailName"></h2></div><button class="btn light" id="close">✕</button></div><div class="box"><div class="grid2"><div class="field">スコア<b id="detailScore"></b></div><div class="field">削減目安<b id="detailHours"></b></div><div class="field">エリア<b id="detailArea"></b></div><div class="field">連絡先<b id="detailContact"></b></div></div><div class="row"><button class="btn light" id="openSite">サイトを開く</button><button class="btn light" id="copyContact">連絡先コピー</button></div></div><div class="box"><h3>課題 / 提案ポイント</h3><div class="tags" id="detailTags"></div></div><div class="box"><h3>次にやること</h3><div class="next" id="nextHint"></div></div><div class="box"><h3>営業文 自動生成</h3><div class="sales" id="salesText"></div><button class="btn blue" style="width:100%;margin-top:9px" id="copySales">営業文をコピー</button></div><div class="box"><h3>営業ステータス</h3><select id="statusEdit"><option value="new">未対応</option><option value="contacted">連絡済</option><option value="replied">返信あり</option><option value="meeting">商談</option><option value="won">契約</option><option value="lost">失注</option></select></div><div class="box"><h3>次アクション</h3><input id="nextAction" placeholder="例：明日14時に電話"></div><div class="box"><h3>営業メモ</h3><textarea id="notes" rows="5"></textarea><button class="btn green" style="width:100%;margin-top:9px" id="save">保存</button></div></div></div><div class="toast" id="toast"></div><script>const API='https://ezjozmfueggxtemumvof.supabase.co/functions/v1/growup-crm';let CODE=sessionStorage.getItem('growup_crm_code')||'',leads=[],current=null;const $=id=>document.getElementById(id),statusLabel={new:'未対応',contacted:'連絡済',replied:'返信あり',meeting:'商談',won:'契約',lost:'失注'};function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function toast(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',1500)}async function api(method='GET',body=null){const p=new URLSearchParams({api:'1'});if(method==='GET'){if($('filter').value!=='all')p.set('status',$('filter').value);if($('q').value.trim())p.set('q',$('q').value.trim())}const r=await fetch(API+'?'+p,{method,headers:{'x-growup-admin':CODE,'Content-Type':'application/json'},body:body?JSON.stringify(body):null});if(r.status===401)throw new Error('unauthorized');if(!r.ok)throw new Error('api');return r.json()}function render(d){leads=d.leads||[];$('sTotal').textContent=d.stats.total;$('sHot').textContent=d.stats.hot;$('sNew').textContent=d.stats.new;$('sMeeting').textContent=d.stats.meeting;$('sWon').textContent=d.stats.won;$('list').innerHTML=leads.length?leads.map(x=>`<div class="lead ${x.hot?'hot':''}" data-id="${x.id}"><div class="score">${x.score}</div><div><div class="name">${x.hot?'<span class="tag hotbadge">🔥HOT</span> ':''}${esc(x.store_name)}</div><div class="meta">${esc(x.area||'エリア未入力')} ・ ${new Date(x.created_at).toLocaleString('ja-JP')}</div><div class="tags">${(x.priorities||[]).slice(0,3).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div></div><div class="status">${statusLabel[x.status]}</div></div>`).join(''):'<div class="empty">まだリードがありません。<br>無料診断が送信されるとここに自動追加されます。</div>';$('list').querySelectorAll('.lead').forEach(el=>el.onclick=()=>openLead(el.dataset.id))}async function load(){try{const d=await api();render(d);$('login').style.display='none'}catch(e){if(e.message==='unauthorized'){$('login').style.display='grid';$('loginErr').textContent='アクセスコードが違います'}else toast('読み込みエラー')}}function salesMessage(x){const a=x.answers||{},pr=x.priorities||[],issue=pr[0]||(a.trouble||[])[0]||'日々の店舗業務';return `突然のご連絡失礼します。GrowUPサポートです。\n\n${x.store_name}様の運用内容を拝見して、特に「${issue}」の部分は自動化でかなり負担を減らせそうだったのでご連絡しました。\n\n${x.score>=80?'現状だと自動化余地がかなり大きく、複数作業を1つの管理画面にまとめる形が合いそうです。':'全部を変える必要はなく、負担の大きい作業だけから部分的に自動化できます。'}\n\n実際の画面をお見せしながら、今の運用でどこまで対応できるか無料で確認できます。もし興味あれば一度だけご案内させてください。`}function hint(x){return x.status==='new'?(x.hot?'🔥 HOTです。今日中に連絡 → デモ提案を最優先。':'まず個別営業文を送って反応を見る。'):x.status==='contacted'?'24〜48時間以内に1回だけ追客。':x.status==='replied'?'返信内容に合わせてデモ or 料金案内へ。':x.status==='meeting'?'商談前に課題・提案機能・金額を3点に絞る。':x.status==='won'?'契約後のヒアリング・請求・制作へ移行。':'失注理由をメモして、しばらく追わない。'}function openLead(id){current=leads.find(x=>x.id===id);if(!current)return;const a=current.answers||{};$('detailHot').textContent=current.hot?'🔥 HOT LEAD':'LEAD';$('detailName').textContent=current.store_name;$('detailScore').textContent=current.score+'/100';$('detailHours').textContent='月'+current.estimated_hours+'時間〜';$('detailArea').textContent=current.area||'-';$('detailContact').textContent=current.contact_info||'未入力';$('detailTags').innerHTML=[...(current.priorities||[]),...(a.trouble||[])].filter((v,i,arr)=>arr.indexOf(v)===i).map(t=>`<span class="tag">${esc(t)}</span>`).join('');$('nextHint').textContent=hint(current);$('salesText').textContent=salesMessage(current);$('statusEdit').value=current.status;$('nextAction').value=current.next_action||'';$('notes').value=current.notes||'';$('openSite').disabled=!a.website;$('openSite').onclick=()=>a.website&&window.open(a.website,'_blank','noopener');$('copyContact').onclick=()=>navigator.clipboard.writeText(current.contact_info||'').then(()=>toast('コピーしました'));$('drawer').style.display='flex'}$('loginBtn').onclick=()=>{CODE=$('code').value.trim();sessionStorage.setItem('growup_crm_code',CODE);$('loginErr').textContent='';load()};$('code').addEventListener('keydown',e=>{if(e.key==='Enter')$('loginBtn').click()});$('refresh').onclick=load;$('search').onclick=load;$('filter').onchange=load;$('q').addEventListener('keydown',e=>{if(e.key==='Enter')load()});$('logout').onclick=()=>{sessionStorage.clear();location.reload()};$('close').onclick=()=>$('drawer').style.display='none';$('drawer').onclick=e=>{if(e.target===$('drawer'))$('drawer').style.display='none'};$('copySales').onclick=()=>navigator.clipboard.writeText($('salesText').textContent).then(()=>toast('営業文をコピーしました'));$('save').onclick=async()=>{try{const d=await api('PATCH',{id:current.id,status:$('statusEdit').value,next_action:$('nextAction').value,notes:$('notes').value});Object.assign(current,d.lead);toast('保存しました');await load();openLead(current.id)}catch(e){toast('保存エラー')}};if(CODE)load();</script></body></html>
