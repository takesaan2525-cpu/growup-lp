<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>無料診断｜GrowUP 店舗DX</title>
  <meta name="description" content="メンズエステ店舗向けDXシステムが自分の店舗に使えるか確認できる無料診断フォームです。">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --blue: #2563EB;
      --blue-dark: #1D4ED8;
      --blue-light: #EFF6FF;
      --green: #16A34A;
      --green-light: #DCFCE7;
      --gray-light: #F8FAFC;
      --gray-mid: #94A3B8;
      --gray-text: #64748B;
      --black: #1E293B;
      --white: #FFFFFF;
    }
    html { scroll-behavior: smooth; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Meiryo", sans-serif;
      font-size: 16px;
      color: var(--black);
      background: var(--gray-light);
      min-height: 100vh;
    }

    /* ===== HEADER ===== */
    .hero {
      background: linear-gradient(135deg, #0F172A 0%, #1E3A5F 60%, #0A2D14 100%);
      color: var(--white);
      text-align: center;
      padding: 48px 20px 40px;
    }
    .hero-badge {
      display: inline-block;
      background: rgba(74,222,128,0.15);
      border: 1px solid rgba(74,222,128,0.3);
      border-radius: 50px;
      padding: 5px 16px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: #4ADE80;
      margin-bottom: 20px;
    }
    .hero h1 {
      font-size: clamp(22px, 5vw, 30px);
      font-weight: 800;
      line-height: 1.45;
      margin-bottom: 14px;
      color: var(--white);
    }
    .hero h1 span { color: #60A5FA; }
    .hero p { font-size: 14px; color: rgba(255,255,255,0.72); line-height: 1.8; }

    /* ===== FORM ===== */
    .container { max-width: 580px; margin: 0 auto; padding: 32px 16px 60px; }

    .form-note {
      background: var(--white);
      border-radius: 14px;
      padding: 16px 20px;
      margin-bottom: 24px;
      font-size: 13px;
      color: var(--gray-text);
      line-height: 1.75;
      border-left: 4px solid var(--blue);
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .form-card {
      background: var(--white);
      border-radius: 18px;
      padding: 28px 24px;
      box-shadow: 0 2px 14px rgba(0,0,0,0.07);
      margin-bottom: 16px;
    }

    .form-group { margin-bottom: 20px; }
    .form-group:last-child { margin-bottom: 0; }

    label {
      display: block;
      font-size: 14px;
      font-weight: 700;
      color: var(--black);
      margin-bottom: 8px;
    }
    label .required {
      font-size: 11px;
      font-weight: 700;
      color: #DC2626;
      background: #FEF2F2;
      padding: 2px 7px;
      border-radius: 50px;
      margin-left: 6px;
    }
    label .optional {
      font-size: 11px;
      font-weight: 600;
      color: var(--gray-mid);
      margin-left: 6px;
    }

    input[type="text"],
    input[type="email"],
    input[type="tel"],
    textarea,
    select {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #CBD5E1;
      border-radius: 10px;
      font-size: 15px;
      font-family: inherit;
      color: var(--black);
      background: var(--white);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input:focus, textarea:focus, select:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
    }
    textarea { resize: vertical; min-height: 90px; }

    .radio-group, .checkbox-group {
      display: flex; flex-direction: column; gap: 8px;
    }
    .radio-row, .check-row {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 14px;
      border: 1.5px solid #E2E8F0;
      border-radius: 10px;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }
    .radio-row:hover, .check-row:hover {
      border-color: var(--blue);
      background: var(--blue-light);
    }
    .radio-row input, .check-row input { flex-shrink: 0; }
    .radio-row span, .check-row span { font-size: 14px; font-weight: 600; color: var(--black); }

    .chip-group {
      display: flex; flex-wrap: wrap; gap: 8px;
    }
    .chip-label {
      display: flex; align-items: center;
      background: var(--gray-light);
      border: 1.5px solid #E2E8F0;
      border-radius: 50px;
      padding: 7px 16px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    .chip-label input { display: none; }
    .chip-label span { font-size: 13px; font-weight: 600; color: var(--gray-text); }
    .chip-label:has(input:checked) {
      border-color: var(--blue);
      background: var(--blue-light);
    }
    .chip-label:has(input:checked) span { color: var(--blue); }

    .btn-submit {
      width: 100%;
      background: linear-gradient(135deg, var(--green), #15803D);
      color: var(--white);
      font-size: 17px;
      font-weight: 800;
      padding: 18px 24px;
      border-radius: 50px;
      border: none;
      cursor: pointer;
      transition: box-shadow 0.2s, transform 0.15s;
      box-shadow: 0 4px 20px rgba(22,163,74,0.4);
      margin-top: 8px;
    }
    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(22,163,74,0.5);
    }

    .privacy-note {
      font-size: 12px;
      color: var(--gray-mid);
      text-align: center;
      margin-top: 12px;
      line-height: 1.7;
    }

    /* ===== THANKS ===== */
    .thanks {
      display: none;
      text-align: center;
      padding: 48px 20px;
    }
    .thanks-icon {
      width: 72px; height: 72px;
      background: var(--green-light);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 20px;
    }
    .thanks-icon svg { width: 36px; height: 36px; fill: none; stroke: var(--green); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .thanks h2 { font-size: 24px; font-weight: 800; margin-bottom: 14px; color: var(--black); }
    .thanks p { font-size: 15px; color: var(--gray-text); line-height: 1.85; max-width: 400px; margin: 0 auto 24px; }
    .btn-back {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--blue);
      color: var(--white);
      font-size: 14px; font-weight: 700;
      padding: 12px 24px; border-radius: 50px;
      text-decoration: none;
    }

    /* ===== BACK LINK ===== */
    .back-link {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 13px; font-weight: 600; color: var(--gray-text);
      margin-bottom: 24px;
      text-decoration: none;
    }
    .back-link:hover { color: var(--blue); }
    .back-link svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    @media (min-width: 600px) {
      .radio-group.row-2, .checkbox-group.row-2 {
        flex-direction: row; flex-wrap: wrap;
      }
      .radio-group.row-2 .radio-row,
      .checkbox-group.row-2 .check-row { flex: 1 1 calc(50% - 4px); }
    }
  </style>
</head>
<body>

  <!-- HERO -->
  <div class="hero">
    <div class="hero-badge">GrowUP 店舗DX — 無料診断</div>
    <h1>自分の店舗で<br><span>使えるか確認する</span></h1>
    <p>ご回答いただいた内容をもとに、対応可能な機能と<br>導入方法をご案内します。</p>
  </div>

  <!-- FORM -->
  <div class="container" id="form-container">
    <a href="index.html" class="back-link">
      <svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      LPに戻る
    </a>

    <div class="form-note">
      送信後、内容を確認してからご連絡します。即契約ではなく、まず対応可能かどうかを確認する流れです。
    </div>

    <form id="shindan-form">
      <!-- 基本情報 -->
      <div class="form-card">
        <div class="form-group">
          <label>店舗名<span class="required">必須</span></label>
          <input type="text" name="store_name" placeholder="例：サンプルエステ" required>
        </div>
        <div class="form-group">
          <label>担当者名<span class="required">必須</span></label>
          <input type="text" name="contact_name" placeholder="例：田中 太郎" required>
        </div>
        <div class="form-group">
          <label>メールアドレスまたはLINE<span class="required">必須</span>
            <span style="font-size:12px;font-weight:400;color:var(--gray-text);display:block;margin-top:2px;">どちらか一方でも大丈夫です</span>
          </label>
          <input type="text" name="contact_info" placeholder="例：sample@email.com またはLINE ID" required>
        </div>
      </div>

      <!-- 店舗情報 -->
      <div class="form-card">
        <div class="form-group">
          <label>店舗エリア<span class="required">必須</span></label>
          <input type="text" name="area" placeholder="例：大阪・難波、東京・新宿">
        </div>
        <div class="form-group">
          <label>店舗数<span class="required">必須</span></label>
          <div class="radio-group row-2">
            <label class="radio-row"><input type="radio" name="store_count" value="1店舗" required><span>1店舗</span></label>
            <label class="radio-row"><input type="radio" name="store_count" value="2〜3店舗"><span>2〜3店舗</span></label>
            <label class="radio-row"><input type="radio" name="store_count" value="4店舗以上"><span>4店舗以上</span></label>
          </div>
        </div>
        <div class="form-group">
          <label>キャスト人数<span class="required">必須</span></label>
          <div class="radio-group row-2">
            <label class="radio-row"><input type="radio" name="cast_count" value="1〜3名" required><span>1〜3名</span></label>
            <label class="radio-row"><input type="radio" name="cast_count" value="4〜7名"><span>4〜7名</span></label>
            <label class="radio-row"><input type="radio" name="cast_count" value="8〜14名"><span>8〜14名</span></label>
            <label class="radio-row"><input type="radio" name="cast_count" value="15名以上"><span>15名以上</span></label>
          </div>
        </div>
      </div>

      <!-- 現状 -->
      <div class="form-card">
        <div class="form-group">
          <label>利用している掲載サイト<span class="optional">複数選択可</span></label>
          <div class="chip-group">
            <label class="chip-label"><input type="checkbox" name="sites" value="エステラブ"><span>エステラブ</span></label>
            <label class="chip-label"><input type="checkbox" name="sites" value="駅ちか"><span>駅ちか</span></label>
            <label class="chip-label"><input type="checkbox" name="sites" value="エス魂"><span>エス魂</span></label>
            <label class="chip-label"><input type="checkbox" name="sites" value="ヒーリング"><span>ヒーリング</span></label>
            <label class="chip-label"><input type="checkbox" name="sites" value="メンエスMAP"><span>メンエスMAP</span></label>
            <label class="chip-label"><input type="checkbox" name="sites" value="ホットペッパー"><span>ホットペッパー</span></label>
            <label class="chip-label"><input type="checkbox" name="sites" value="その他"><span>その他</span></label>
          </div>
        </div>
        <div class="form-group">
          <label>現在の主な予約方法<span class="optional">複数選択可</span></label>
          <div class="chip-group">
            <label class="chip-label"><input type="checkbox" name="booking" value="電話"><span>電話</span></label>
            <label class="chip-label"><input type="checkbox" name="booking" value="LINE"><span>LINE</span></label>
            <label class="chip-label"><input type="checkbox" name="booking" value="掲載サイト経由"><span>掲載サイト経由</span></label>
            <label class="chip-label"><input type="checkbox" name="booking" value="自前の予約システム"><span>自前の予約システム</span></label>
          </div>
        </div>
      </div>

      <!-- 課題・ニーズ -->
      <div class="form-card">
        <div class="form-group">
          <label>特に面倒に感じている業務<span class="optional">複数選択可</span></label>
          <div class="checkbox-group row-2">
            <label class="check-row"><input type="checkbox" name="trouble" value="掲載サイトの更新"><span>掲載サイトの更新</span></label>
            <label class="check-row"><input type="checkbox" name="trouble" value="出勤情報の管理"><span>出勤情報の管理</span></label>
            <label class="check-row"><input type="checkbox" name="trouble" value="予約の管理・空き枠管理"><span>予約の管理・空き枠管理</span></label>
            <label class="check-row"><input type="checkbox" name="trouble" value="キャストへの連絡"><span>キャストへの連絡</span></label>
            <label class="check-row"><input type="checkbox" name="trouble" value="給与計算"><span>給与計算</span></label>
            <label class="check-row"><input type="checkbox" name="trouble" value="ダブルブッキング対策"><span>ダブルブッキング対策</span></label>
          </div>
        </div>
        <div class="form-group">
          <label>希望する機能<span class="optional">複数選択可</span></label>
          <div class="chip-group">
            <label class="chip-label"><input type="checkbox" name="features" value="掲載自動更新"><span>掲載自動更新</span></label>
            <label class="chip-label"><input type="checkbox" name="features" value="ネット予約"><span>ネット予約</span></label>
            <label class="chip-label"><input type="checkbox" name="features" value="LINE通知"><span>LINE通知</span></label>
            <label class="chip-label"><input type="checkbox" name="features" value="予約管理"><span>予約管理</span></label>
            <label class="chip-label"><input type="checkbox" name="features" value="キャスト管理"><span>キャスト管理</span></label>
            <label class="chip-label"><input type="checkbox" name="features" value="給与計算"><span>給与計算</span></label>
            <label class="chip-label"><input type="checkbox" name="features" value="売上管理"><span>売上管理</span></label>
          </div>
        </div>
        <div class="form-group">
          <label>実機デモの希望<span class="required">必須</span></label>
          <div class="radio-group row-2">
            <label class="radio-row"><input type="radio" name="demo_request" value="デモを希望する" required><span>デモを希望する</span></label>
            <label class="radio-row"><input type="radio" name="demo_request" value="まず資料を見たい"><span>まず資料を見たい</span></label>
            <label class="radio-row"><input type="radio" name="demo_request" value="どちらでもよい"><span>どちらでもよい</span></label>
          </div>
        </div>
        <div class="form-group">
          <label>その他 ご要望・ご質問<span class="optional">任意</span></label>
          <textarea name="message" placeholder="「こんな機能が欲しい」「現状の不満」など、なんでもどうぞ"></textarea>
        </div>
      </div>

      <button type="submit" class="btn-submit">内容を送信して診断を依頼する</button>
      <p class="privacy-note">送信後、内容を確認の上でご連絡します。<br>即契約や強引な勧誘はしません。</p>
    </form>
  </div>

  <!-- THANKS -->
  <div class="container thanks" id="thanks-container">
    <div class="thanks-icon">
      <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
    </div>
    <h2>送信しました</h2>
    <p>内容を確認後、対応可能な機能と導入方法をご案内します。<br>通常1〜2営業日以内にご連絡します。</p>
    <a href="index.html" class="btn-back">
      <svg style="width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;" viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 19"/></svg>
      LPに戻る
    </a>
  </div>

  <script>
    const form = document.getElementById('shindan-form');
    const formContainer = document.getElementById('form-container');
    const thanksContainer = document.getElementById('thanks-container');

    form.addEventListener('submit', function(e) {
      e.preventDefault();

      // チェックボックスの値を収集
      const data = new FormData(form);
      const obj = {};
      for (const [key, value] of data.entries()) {
        if (obj[key]) {
          obj[key] = Array.isArray(obj[key]) ? [...obj[key], value] : [obj[key], value];
        } else {
          obj[key] = value;
        }
      }

      // Netlify Forms / Formspree などのエンドポイントがあれば送信
      // 現在はサンキュー表示のみ（将来的にエンドポイントを設定してください）
      console.log('診断フォーム送信:', obj);

      formContainer.style.display = 'none';
      thanksContainer.style.display = 'block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  </script>
</body>
</html>
